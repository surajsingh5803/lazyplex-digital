name: Generate customer-first editorial release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [customer-first-editorial]
    paths:
      - scripts/apply-customer-first-editorial.mjs
      - .github/workflows/generate-customer-first-editorial.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name == 'push' || (github.head_ref == 'customer-first-editorial' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-first-editorial
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if grep -q 'Turn digital attention into' index.html; then node scripts/apply-customer-first-editorial.mjs; fi
      - run: node scripts/apply-navigation-v3.mjs
      - run: node scripts/seo-quality-check.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish generated customer-first content and shared navigation"
          git push origin HEAD:customer-first-editorial
