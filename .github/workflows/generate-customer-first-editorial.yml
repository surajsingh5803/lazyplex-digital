name: Generate customer-first editorial release
on:
  push:
    branches: [customer-first-editorial]
    paths:
      - scripts/apply-customer-first-editorial.mjs
      - .github/workflows/generate-customer-first-editorial.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-customer-first-editorial.mjs
      - run: node scripts/apply-navigation-v3.mjs
      - run: node scripts/seo-quality-check.mjs
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Publish generated customer-first content and shared navigation"
          git push origin HEAD:customer-first-editorial
