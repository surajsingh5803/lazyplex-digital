name: Generate approved Lazy Plex favicons

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-favicons.py"
      - "assets/lazyplex-logo.webp"
      - ".github/workflows/generate-favicons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install "pillow>=11,<13"
      - name: Generate square PNG and ICO favicons
        run: python scripts/generate-favicons.py
      - name: Commit favicon files if changed
        shell: bash
        run: |
          git add favicon.png favicon.ico apple-touch-icon.png assets/favicon.png
          if git diff --cached --quiet; then
            echo "All favicon assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brand: generate Lazy Plex favicons from approved logo"
          git push origin HEAD:main
