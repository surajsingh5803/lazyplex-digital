name: GitHub Pages production verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check deployed Digital V2 and SEO discovery
        run: |
          set -e
          base=https://digital.lazyplex.com
          ready=0
          for i in {1..12}; do
            if curl -fsSL --max-time 20 "$base/pricing/?verify=${GITHUB_RUN_ID}" -o /tmp/lp-price && grep -q 'pricing-catalogue' /tmp/lp-price; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          curl -fsSL --max-time 30 "$base/" -o /tmp/lp-home
          grep -q 'outcome-lab' /tmp/lp-home
          ! grep -qi 'name="lp-preview"' /tmp/lp-home
          ! grep -qi 'content="noindex' /tmp/lp-home
          curl -fsSL --max-time 30 "$base/sitemap.xml" -o /tmp/lp-sitemap
          grep -q 'https://digital.lazyplex.com/pricing/' /tmp/lp-sitemap
          grep -q 'https://digital.lazyplex.com/growth-planner/' /tmp/lp-sitemap
          curl -fsSL --max-time 30 "$base/robots.txt" | grep -q 'Sitemap: https://digital.lazyplex.com/sitemap.xml'
          curl -fsSL --max-time 30 "$base/llms.txt" | grep -q 'Published pricing'
          test "$(curl -fsSL --max-time 30 "$base/98ee5d1795784dcd838024c1ada1bd49.txt" | tr -d '\r\n')" = "98ee5d1795784dcd838024c1ada1bd49"
          for p in /pricing/ /approach/ /services/ /growth-planner/ /contact/ /services/conversion-optimisation/ /services/crm-automation/ /services/analytics-reporting/ /work/ /industries/ /industries/healthcare/ /industries/real-estate/ /industries/education/ /industries/ecommerce/ /industries/beauty-wellness/ /industries/hospitality/ /industries/manufacturing-b2b/ /industries/professional-services/ /industries/startups-smes/ /insights/how-to-choose-digital-marketing-agency/ /insights/small-business-digital-marketing-budget-india/ /insights/seo-vs-google-ads-vs-meta-ads-service-business/ /insights/why-marketing-leads-not-converting/ /insights/healthcare-marketing-strategy-clinics-hospitals/ /insights/real-estate-marketing-strategy-developers-site-visits/ /insights/seo-ai-search-businesses-2026-guide/ /insights/how-to-measure-marketing-roi-leads-revenue/; do
            curl -fsSL --max-time 30 "$base$p" -o /tmp/lp-destination
            ! grep -qi 'name="lp-preview"' /tmp/lp-destination
            ! grep -qi 'content="noindex' /tmp/lp-destination
            echo "Destination $p verified"
          done
          echo 'All redirect destinations, GitHub Pages production and discovery files verified'
