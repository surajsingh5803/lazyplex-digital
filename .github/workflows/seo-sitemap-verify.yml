name: Verify Lazy Plex Sitemaps and IndexNow Ownership
on:
  push:
    paths:
      - '.github/workflows/seo-sitemap-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check public XML sitemap URLs and IndexNow ownership files
        run: python3 scripts/seo-sitemap-verify.py
