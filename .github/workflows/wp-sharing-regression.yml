name: WordPress corporate content and sharing verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify sharing and likes are not displayed
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch();
          const expected={'/':'Grow your business. Simplify your operations.','/about/':'Meet the company behind your next business solution.','/leadership/':'Meet the founder behind Lazy Plex.','/our-approach/':'From your business challenge to a practical solution.','/businesses/':'Find the right solution for your needs.','/software/':'Simplify your business with practical software.','/labs/':'Discover the games and apps we are building.','/products/':'Explore our software, games and digital tools.','/luma-circuit/':'Rotate the wires. Complete the circuit. Solve the puzzle.','/insights/':'Practical insights for better business decisions.','/contact/':'How can we help you?','/partnerships/':'Explore business and technology partnerships.','/product-support/':'Need help with a Lazy Plex product?'};
          const links=new Set();
          try {
            for(const width of [390,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              for(const path of [...Object.keys(expected),'/privacy-policy/']){
                let response;
                for(let attempt=0;attempt<3;attempt++){
                  response=await page.goto('https://lazyplex.com'+path,{waitUntil:'domcontentloaded'});
                  if(response.status()!==429)break;
                  await page.waitForTimeout(10000*(attempt+1));
                }
                assert.equal(response.status(),200,path);
                const result=await page.evaluate(()=>({widgets:[...document.querySelectorAll('.sharedaddy,.sd-sharing-enabled,.sd-like-enabled,.jetpack-likes-widget-wrapper,.post-likes-widget,.wp-block-jetpack-sharing-buttons,.wp-block-jetpack-likes')].filter(e=>e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden').length,text:document.body.innerText.includes('Share this:')||document.body.innerText.includes('Like this:')||document.body.innerText.includes('Customize buttons')}));
                assert.equal(result.widgets,0,path);
                assert.equal(result.text,false,path);
                if(expected[path]){
                  const audit=await page.evaluate(()=>({headings:[...document.querySelectorAll('h1')].map(h=>h.textContent.trim()),overflow:document.documentElement.scrollWidth>innerWidth+2,links:[...document.querySelectorAll('main a[href],.page-content a[href]')].map(a=>a.href)}));
                  assert.deepEqual(audit.headings,[expected[path]],path);
                  assert.equal(audit.overflow,false,path+' overflow at '+width);
                  for(const link of audit.links)if(link.startsWith('https://lazyplex.com/')||link.startsWith('https://digital.lazyplex.com/')||link.startsWith('https://estatecrm.lazyplex.com/'))links.add(link.split('#')[0]);
                }
                console.log(path+' '+width+'px: no visible sharing or Like widgets');
                await page.waitForTimeout(1200);
              }
              await page.close();
            }
          }finally{await browser.close()}
          console.log('Corporate content and layout verified. Distinct internal and product destinations: '+links.size);
          JS
