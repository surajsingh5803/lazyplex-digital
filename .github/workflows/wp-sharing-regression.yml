name: WordPress sharing removal verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify sharing and likes are not displayed
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch();
          try {
            for(const width of [390,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              for(const path of ['/','/insights/','/leadership/','/products/','/privacy-policy/']){
                let response;
                for(let attempt=0;attempt<3;attempt++){
                  response=await page.goto('https://lazyplex.com'+path,{waitUntil:'domcontentloaded'});
                  if(response.status()!==429)break;
                  await page.waitForTimeout(10000*(attempt+1));
                }
                assert.equal(response.status(),200,path);
                const result=await page.evaluate(()=>({widgets:[...document.querySelectorAll('.sharedaddy,.sd-sharing-enabled,.sd-like-enabled,.jetpack-likes-widget-wrapper,.post-likes-widget,.wp-block-jetpack-sharing-buttons,.wp-block-jetpack-likes')].filter(e=>e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden').length,text:document.body.innerText.includes('Share this:')||document.body.innerText.includes('Like this:')||document.body.innerText.includes('Customize buttons')}));
                assert.equal(result.widgets,0,path);
                assert.equal(result.text,false,path);
                console.log(path+' '+width+'px: no visible sharing or Like widgets');
                await page.waitForTimeout(1200);
              }
              await page.close();
            }
          }finally{await browser.close()}
          JS
