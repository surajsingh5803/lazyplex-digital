name: SEO site quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        run: |
          node --check assets/main.js
          node --check scripts/seo-quality-check.mjs
          node --check assets/real-estate-funnel.js
          node --check assets/budget-planner.js
          node --check scripts/test-budget-planner.mjs
          node --check scripts/test-attribution.mjs
      - name: Verify real estate funnel calculator calculations
        run: node scripts/test-real-estate-funnel.mjs
      - name: Verify reverse marketing budget planner
        run: node scripts/test-budget-planner.mjs
      - name: Verify safe attribution and WhatsApp handoff
        run: node scripts/test-attribution.mjs
      - name: Check key text contrast ratios
        run: node scripts/test-contrast.mjs
      - name: Verify IndexNow key, sitemap and changed-URL filtering
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py' -v
      - name: Check sitemap, titles, canonicals, structured data and internal links
        run: node scripts/seo-quality-check.mjs
