name: Final brand quality gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-final-brand-quality.mjs && git diff --exit-code
      - run: node scripts/seo-quality-check.mjs
      - run: node scripts/corporate-migration-qa.mjs
