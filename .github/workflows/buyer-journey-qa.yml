name: Lazy Plex Buyer Journey QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/buyer-journey-audit.mjs'
      - '.github/workflows/buyer-journey-qa.yml'

permissions:
  contents: read

jobs:
  check-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit customer pages at four viewports
        run: node scripts/buyer-journey-audit.mjs
