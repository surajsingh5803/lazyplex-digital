name: IndexNow — direct publishing notifications
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose recent seed URLs or URLs changed in last commit"
        required: true
        type: choice
        default: recent
        options:
          - recent
          - changed
      urls:
        description: "Optional changed URLs, comma/newline separated; overrides mode"
        type: string
        required: false
permissions:
  contents: read
jobs:
  indexnow:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Validate IndexNow URL lists and canonical key
        run: python3 -m unittest discover -s scripts -p 'test_indexnow.py' -v
      - name: Verify publicly served key, then submit only changed URLs
        env:
          INDEXNOW_MODE: ${{ inputs.mode }}
          INDEXNOW_MANUAL_URLS: ${{ inputs.urls }}
        run: python3 scripts/indexnow-submit.py
