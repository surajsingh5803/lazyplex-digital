name: AI Search Crawl and Favicon Validation

on:
  push:
    branches: [main]
    paths:
      - "robots.txt"
      - "llms.txt"
      - "favicon.png"
      - "scripts/check-ai-crawl-access.py"
      - ".github/workflows/ai-crawl-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crawl-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout site configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate search crawler rules and sitemap locally
        run: python3 scripts/check-ai-crawl-access.py
      - name: Confirm site has deployed this commit
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-for-pages.py
      - name: Smoke test real HTTPS responses for major AI and search user-agents
        run: python3 scripts/check-ai-crawl-access.py --live
