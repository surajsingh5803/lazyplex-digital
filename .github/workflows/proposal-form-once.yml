name: LP Proposal Form One-Time QA
on:
  push:
    paths:
      - '.github/workflows/proposal-form-once.yml'
permissions:
  contents: read
jobs:
  submit-one-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Submit one clearly marked internal test enquiry
        run: node scripts/proposal-smoke-once.mjs
